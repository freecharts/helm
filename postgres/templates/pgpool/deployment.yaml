{{- if .Values.pgpool.enable -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postgres.pgpoolName" . }}
  namespace: {{ include "helper.names.namespace" . }}
  labels:
    {{- include "helper.labels.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgpool
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "helper.labels.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgpool
  template:
    metadata:
      labels:
        {{- include "helper.labels.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pgpool
        role: pool
    spec:
      serviceAccountName: {{ include "postgres.serviceAccountName" . }}
      initContainers:
        - name: waiting-on-primary
          image: {{ include "helper.images.image" (dict "imageRoot" .Values.pgpool.initImage "global" .Values.global) }}
          imagePullPolicy: {{ include "helper.images.pullPolicy" (dict "imageRoot" .Values.pgpool.initImage "global" .Values.global) }}
          securityContext:
            runAsUser: 0
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: PGPOOL_DATA
              value: /opt/pgpool
          command:
            - sh
          args:
            - -c
            - |
              PRIMARY={{ include "postgres.primaryName" .}}.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local
              echo "Waiting for primary to be ready..."
              until pg_isready -h $PRIMARY; do
                  echo "Waiting for primary to be ready..."
                  sleep 5
              done
              echo "Primary is ready..."

              echo "Init data for pgpool"
              mkdir -p $PGPOOL_DATA/conf $PGPOOL_DATA/logs $PGPOOL_DATA/run && \
              chmod 700 $PGPOOL_DATA/conf $PGPOOL_DATA/logs $PGPOOL_DATA/run && \
              chown -R {{ .Values.pgpool.containerSecurityContext.runAsUser }}:{{ .Values.pgpool.containerSecurityContext.runAsGroup }} $PGPOOL_DATA/conf $PGPOOL_DATA/logs $PGPOOL_DATA/run

              echo "Creating backends.conf for pgpool..."
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              SVC={{ include "postgres.headlessName" .}}
              API="https://kubernetes.default.svc/apis/discovery.k8s.io/v1/namespaces/$NS/endpointslices"

              echo "# Generated by init container" > $PGPOOL_DATA/conf/backends.conf
              wget -qO- \
                  --ca-certificate=$CA \
                  --header="Authorization: Bearer $TOKEN" \
                  "$API" \
                | jq -r --arg svc "$SVC" '
                    .items[]
                    | select(.metadata.labels["kubernetes.io/service-name"]==$svc)
                    | .endpoints[]
                    | select(.conditions.ready == true)
                    | .targetRef.name
                  ' \
                | sort -V | \
                while IFS=$'\t' read -r host
                do
                    id="${host##*-}"

                    cat <<EOF
              backend_hostname${id} = '${host}.${SVC}.${NS}.svc.cluster.local'
              backend_port${id} = 5432
              backend_weight${id} = 1
              backend_flag${id} = 'ALLOW_TO_FAILOVER'
              EOF
                done >> $PGPOOL_DATA/conf/backends.conf

              chown -R {{ .Values.pgpool.containerSecurityContext.runAsUser }}:{{ .Values.pgpool.containerSecurityContext.runAsGroup }} $PGPOOL_DATA/conf/backends.conf
          volumeMounts:
            - name: data
              mountPath: /opt/pgpool
      containers:
        - name: {{ include "postgres.pgpoolName" . }}
          image: {{ include "helper.images.image" (dict "imageRoot" .Values.pgpool.image "global" .Values.global) }}
          imagePullPolicy: {{ include "helper.images.pullPolicy" (dict "imageRoot" .Values.pgpool.image "global" .Values.global) }}
          {{- include "helper.pods.renderSecurityContext" (dict "securityContext" .Values.pgpool.containerSecurityContext) | nindent 10 }}
          ports:
            - name: postgresql
              containerPort: {{ .Values.pgpool.containerPort }}
          {{- if .Values.pgpool.diagnosticModeEnabled }}
          command: {{- include "helper.values.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          args: {{- include "helper.values.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: PGPOOL_DATA
              value: /opt/pgpool
            - name: PGPOOL_BACKEND_USER
              value: {{ .Values.global.pgDbUser }}
            - name: PGPOOL_BACKEND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helper.names.fullname" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /opt/pgpool
            - name: config
              mountPath: /opt/pgpool/conf/pgpool.conf
              subPath: pgpool.conf
        - name: {{ include "postgres.pgpoolName" . }}-watcher
          image: {{ include "helper.images.image" (dict "imageRoot" .Values.pgpool.watcherImage "global" .Values.global) }}
          imagePullPolicy: {{ include "helper.images.pullPolicy" (dict "imageRoot" .Values.pgpool.watcherImage "global" .Values.global) }}
          {{- include "helper.pods.renderSecurityContext" (dict "securityContext" .Values.pgpool.containerSecurityContext) | nindent 10 }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: PGPOOL_DATA
              value: /opt/pgpool
          command:
            - sh
          args:
            - -c
            - |
              echo "Starting pgpool watcher..."
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              SVC={{ include "postgres.headlessName" .}}

              API="https://kubernetes.default.svc/apis/discovery.k8s.io/v1/namespaces/$NS/endpointslices"

              while true; do
                echo "[watcher] fetching endpointslices..."
                echo "# Generated by init container" > $PGPOOL_DATA/conf/backends.conf

                wget -qO- \
                  --ca-certificate=$CA \
                  --header="Authorization: Bearer $TOKEN" \
                  "$API" \
                | jq -r --arg svc "$SVC" '
                    .items[]
                    | select(.metadata.labels["kubernetes.io/service-name"]==$svc)
                    | .endpoints[]
                    | select(.conditions.ready == true)
                    | .targetRef.name
                  ' \
                | sort -V | \
                while IFS=$'\t' read -r host
                do
                    id="${host##*-}"

                    cat <<EOF
              backend_hostname${id} = '${host}.${SVC}.${NS}.svc.cluster.local'
              backend_port${id} = 5432
              backend_weight${id} = 1
              backend_flag${id} = 'ALLOW_TO_FAILOVER'
              EOF
                done >> $PGPOOL_DATA/conf/backends.conf
                sleep 10
              done
          volumeMounts:
            - name: data
              mountPath: /opt/pgpool
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "helper.names.fullname" . }}
{{- end -}}
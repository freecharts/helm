{{- if .Values.pgpool.enable -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "postgres.pgpoolName" . }}
  namespace: {{ include "helper.names.namespace" . }}
  labels:
    {{- include "helper.labels.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgpool
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "helper.labels.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgpool
  template:
    metadata:
      labels:
        {{- include "helper.labels.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pgpool
        role: pool
    spec:
      serviceAccountName: {{ include "postgres.serviceAccountName" . }}
      {{- include "helper.images.imagePullSecrets" (dict "imageRoot" .Values.pgpool "global" .Values.global) | nindent 6 }}
      {{- include "helper.pods.renderSecurityContext" (dict "securityContext" .Values.pgpool.podSecurityContext) | nindent 6 }}
      initContainers:
        - name: waiting-on-primary
          image: {{ include "helper.images.image" (dict "imageRoot" .Values.pgpool.initImage "global" .Values.global) }}
          imagePullPolicy: {{ include "helper.images.pullPolicy" (dict "imageRoot" .Values.pgpool.initImage "global" .Values.global) }}
          securityContext:
            runAsUser: 0
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: PGPOOL_DATA
              value: /opt/pgpool
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.containerPort | quote }}
            - name: PGPOOL_USER
              value: {{ .Values.pgpool.pgPoolUser | quote }}
            - name: PGPOOL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helper.names.fullname" . }}
                  key: PGPOOL_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.global.pgDbName }}
            - name: POSTGRES_USER
              value: {{ .Values.global.pgDbUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helper.names.fullname" . }}
                  key: POSTGRES_PASSWORD
          command:
            - sh
          args:
            - -c
            - |
              /opt/scripts/init-pgpool.sh
          volumeMounts:
            - name: data
              mountPath: /opt/pgpool
            - name: scripts
              mountPath: /opt/scripts/init-pgpool.sh
              subPath: init-pgpool.sh
              readOnly: true
      containers:
        - name: {{ include "postgres.pgpoolName" . }}
          image: {{ include "helper.images.image" (dict "imageRoot" .Values.pgpool.image "global" .Values.global) }}
          imagePullPolicy: {{ include "helper.images.pullPolicy" (dict "imageRoot" .Values.pgpool.image "global" .Values.global) }}
          {{- include "helper.pods.renderSecurityContext" (dict "securityContext" .Values.pgpool.containerSecurityContext) | nindent 10 }}
          ports:
            - name: postgresql
              containerPort: {{ .Values.pgpool.containerPort }}
          {{- if .Values.pgpool.diagnosticModeEnabled }}
          command: {{- include "helper.values.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          args: {{- include "helper.values.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: PGPOOL_DATA
              value: /opt/pgpool
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.containerPort | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.global.pgDbName | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.global.pgDbUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helper.names.fullname" . }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /opt/pgpool
            - name: config
              mountPath: /opt/pgpool/conf/pgpool.conf
              subPath: pgpool.conf
            - name: scripts
              mountPath: /opt/pgpool/failover.sh
              subPath: failover.sh
        - name: {{ include "postgres.pgpoolName" . }}-watcher
          image: {{ include "helper.images.image" (dict "imageRoot" .Values.pgpool.image "global" .Values.global) }}
          imagePullPolicy: {{ include "helper.images.pullPolicy" (dict "imageRoot" .Values.pgpool.image "global" .Values.global) }}
          {{- include "helper.pods.renderSecurityContext" (dict "securityContext" .Values.pgpool.containerSecurityContext) | nindent 10 }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: PGPOOL_DATA
              value: /opt/pgpool
            - name: PGPOOL_USER
              value: {{ .Values.pgpool.pgPoolUser }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.containerPort | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.global.pgDbName | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.global.pgDbUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helper.names.fullname" . }}
                  key: POSTGRES_PASSWORD
          command:
            - sh
          args:
            - -c
            - |
              echo "Starting pgpool watcher..."
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              SVC={{ include "postgres.headlessName" .}}

              echo "Waiting for pgpool to be ready..."
              until pcp_node_count -h localhost -U $PGPOOL_USER -p 9898 -w > /dev/null 2>&1; do
                echo "Waiting for pgpool to be ready..."
                sleep 5
              done

              echo "Pgpool is ready..."

              while true; do
                for id in $(seq 0 {{ .Values.pgpool.maxBackendNodes }}); do
                  INFO=$(pcp_node_info -h localhost -U $PGPOOL_USER -p 9898 -w -n $id)
                  STATUS=$(echo $INFO | awk '{print $3}')
                  DBHOST=$(echo $INFO | awk '{print $1}')

                  if [ "$STATUS" -eq 3 ]; then
                    
                    if pg_isready -h "$DBHOST" -p $POSTGRES_PORT -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1 && \
                        psql -h "$DBHOST" -p $POSTGRES_PORT -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1" >/dev/null 2>&1; then
                      READY=1
                    else
                      READY=0
                    fi

                    # echo "Node $id ($DBHOST): status=$STATUS, ready=$READY"
                    
                    # ----------------------------
                    # ATTACH LOGIC
                    # ----------------------------
                    if [ "$READY" -eq 1 ]; then
                      echo "ATTACH node $id ($DBHOST)"

                      pcp_attach_node \
                        -h localhost \
                        -U $PGPOOL_USER \
                        -p 9898 \
                        -w \
                        -n $id
                    fi

                  fi

                done
                
                sleep 10 &
                wait $!
              done

              echo "pgpool watcher stopped."
          volumeMounts:
            - name: data
              mountPath: /opt/pgpool
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "helper.names.fullname" . }}
            defaultMode: 0440
        - name: scripts
          configMap:
            name: {{ include "helper.names.fullname" . }}-scripts
            defaultMode: 0550
{{- end -}}
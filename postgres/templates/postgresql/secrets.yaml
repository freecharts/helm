apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helper.names.fullname" . }}
  namespace: {{ include "helper.names.namespace" . }}
  labels:
    {{- include "helper.labels.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
data:
  POSTGRES_PASSWORD: {{
      include "helper.secret.value" (dict
        "secretName" (include "helper.names.fullname" .)
        "namespace" (include "helper.names.namespace" .)
        "key" "POSTGRES_PASSWORD"
        "value" .Values.global.pgDbPassword
        "length" 32
      ) | quote
  }}
  {{- if .Values.pgpool.enable }}
  POSTGRES_REPUSER_PASSWORD: {{
      include "helper.secret.value" (dict
        "secretName" (include "helper.names.fullname" .)
        "namespace" (include "helper.names.namespace" .)
        "key" "POSTGRES_REPUSER_PASSWORD"
        "value" .Values.global.pgRepPassword
        "length" 32
      ) | quote
  }}
  PGPOOL_PASSWORD: {{
      include "helper.secret.value" (dict
        "secretName" (include "helper.names.fullname" .)
        "namespace" (include "helper.names.namespace" .)
        "key" "PGPOOL_PASSWORD"
        "value" .Values.global.pgPoolPassword
        "length" 32
      ) | quote
  }}
  {{- end }}
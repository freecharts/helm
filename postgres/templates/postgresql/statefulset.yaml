apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "helper.names.fullname" . }}
  namespace: {{ include "helper.names.namespace" . }}
  labels:
    {{- include "helper.labels.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
    role: data
spec:
  serviceName: {{ printf "%s-hl" (include "helper.names.fullname" .) }}
  replicas: {{ .Values.postgresql.replicas }}
  podManagementPolicy: {{ .Values.postgresql.podManagementPolicy | quote }}
  updateStrategy: {{- toYaml .Values.postgresql.updateStrategy | nindent 4 }}
  selector:
    matchLabels: {{- include "helper.labels.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "helper.labels.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
        role: data
    spec:
      {{- if .Values.pgpool.enable }}
      serviceAccountName: {{ include "helper.names.fullname" . }}
      {{- end }}
      {{- include "helper.images.imagePullSecrets" (dict "imageRoot" .Values.postgresql "global" .Values.global) | nindent 6 }}
      {{- include "helper.pods.renderSecurityContext" (dict "securityContext" .Values.postgresql.podSecurityContext) | nindent 6 }}
      affinity:
        podAntiAffinity: {{- include "helper.pods.renderSoftAffinity" (dict "component" "postgresql" "role" "data" "context" $) | nindent 10 }}
      {{- if .Values.postgresql.podAffinity }}
        podAffinity: 
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.postgresql.podAffinityWeight }}
              podAffinityTerm:
            {{- with .Values.postgresql.podAffinity }}
            {{- toYaml . | nindent 16 }}
            {{- end }}
      {{- end }}
      {{- if .Values.postgresql.nodeSelector }}
      nodeSelector: {{- include "helper.values.render" (dict "value" .Values.postgresql.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.tolerations }}
      tolerations: {{- include "helper.values.render" (dict "value" .Values.postgresql.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.postgresql.priorityClassName }}
      priorityClassName: {{ .Values.postgresql.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.postgresql.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.postgresql.terminationGracePeriodSeconds }}
      {{- end }}
      initContainers:
        - name: init-chmod-data
          image: {{ include "helper.images.image" (dict "imageRoot" .Values.postgresql.initImage "global" .Values.global) }}
          imagePullPolicy: {{ include "helper.images.pullPolicy" (dict "imageRoot" .Values.postgresql.initImage "global" .Values.global) }}
          securityContext:
            runAsUser: 0
          command:
            - sh
          args:
            - -c
            - |
              {{- if .Values.pgpool.enable }}
              ORDINAL="${POD_NAME##*-}"
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              if { [ -f "$PGDATA/PG_VERSION" ] && [ ! -f "$PGDATA/standby.signal" ]; } || \
                 { [ ! -f "$PGDATA/PG_VERSION" ] && [ "$ORDINAL" = "0" ]; } 
                 then
                  echo "I am the Primary, then modifying pod labels to role=data-primary"
                  if wget -qO /dev/null \
                    --ca-certificate=$CA \
                    --header="Authorization: Bearer $TOKEN" \
                    --header="Content-Type: application/strategic-merge-patch+json" \
                    --method=PATCH --body-data='{"metadata":{"labels":{"role":"data-primary"}}}' \
                    https://kubernetes.default.svc/api/v1/namespaces/$NS/pods/$POD_NAME
                  then
                      echo "Pod labels modified successfully"
                  else
                      echo "Failed to modify pod labels"  
                  fi
              fi
              {{- end }}
              if [ -f "$PGDATA/PG_VERSION" ]; then
                  echo "Already initialized, skipping folder structure creation"
                  exit 0
              fi

              FOLDER={{ .Values.postgresql.persistence.mountPath }}
              echo "Creating folder $FOLDER structure and setting permissions"
              mkdir -p $FOLDER/pgdata $FOLDER/conf && \
              chmod 700 $FOLDER/pgdata $FOLDER/conf && \
              chown -R {{ .Values.postgresql.containerSecurityContext.runAsUser }}:{{ .Values.postgresql.containerSecurityContext.runAsGroup }} $FOLDER/pgdata $FOLDER/conf
              mkdir -p /var/run/postgresql && \
              chmod 777 /var/run/postgresql && \
              chown -R {{ .Values.postgresql.containerSecurityContext.runAsUser }}:{{ .Values.postgresql.containerSecurityContext.runAsGroup }} /var/run/postgresql
          env:
            - name: PGDATA
              value: {{ printf "%s/%s" .Values.postgresql.persistence.mountPath "pgdata" | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: {{ .Values.postgresql.persistence.mountPath }}
            - name: empty-dir
              mountPath: /var/run
              subPath: run
        {{- if .Values.pgpool.enable }}
        - name: init-replication
          image: {{ include "helper.images.image" (dict "imageRoot" .Values.postgresql.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ include "helper.images.pullPolicy" (dict "imageRoot" .Values.postgresql.image "global" .Values.global "chart" .Chart) }}
          securityContext:
            runAsUser: 0
          command:
            - bash
          args:
            - -c
            - |
              if [ -f "$PGDATA/PG_VERSION" ]; then
                  echo "Already initialized, skipping replication setup"
                  exit 0
              fi

              echo "Initializing replication"
              ORDINAL="${POD_NAME##*-}"
              if [ "$ORDINAL" = "0" ];  then
                  echo "I am the Primary"
                  exit 0
              fi

              echo "I am a Replica"
              PRIMARY={{ printf "%s-primary" (include "helper.names.fullname" .) }}.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local
              echo "Waiting for primary to be ready..."
              until pg_isready -h $PRIMARY; do
                  echo "Waiting for primary to be ready..."
                  sleep 5
              done
              echo "Primary is ready, starting replication..."
              FOLDER={{ .Values.postgresql.persistence.mountPath }}
              until pg_basebackup -h $PRIMARY \
                -D $FOLDER/pgdata -U {{ .Values.global.pgDbUser }} -vPR \
                --wal-method=stream; 
                do
                  echo "Base backup failed, retrying..."
                  sleep 5
              done
              chmod 700 $FOLDER/pgdata && \
              chown -R {{ .Values.postgresql.containerSecurityContext.runAsUser }}:{{ .Values.postgresql.containerSecurityContext.runAsGroup }} $FOLDER/pgdata
              echo "Base backup completed, replication setup is done."
          env:
            - name: PGDATA
              value: {{ printf "%s/%s" .Values.postgresql.persistence.mountPath "pgdata" | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: {{ .Values.postgresql.persistence.mountPath }}
        {{- end }}
      containers:
        - name: {{ include "helper.names.fullname" . }}
          image: {{ include "helper.images.image" (dict "imageRoot" .Values.postgresql.image "global" .Values.global "chart" .Chart) }}
          imagePullPolicy: {{ include "helper.images.pullPolicy" (dict "imageRoot" .Values.postgresql.image "global" .Values.global "chart" .Chart) }}
          {{- include "helper.pods.renderSecurityContext" (dict "securityContext" .Values.postgresql.containerSecurityContext) | nindent 10 }}
          ports:
            - name: postgresql
              containerPort: {{ .Values.postgresql.containerPort }}
              protocol: TCP
          {{- if .Values.postgresql.diagnosticModeEnabled }}
          command: {{- include "helper.values.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          args: {{- include "helper.values.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone }}
            - name: PGDATA
              value: {{ printf "%s/%s" .Values.postgresql.persistence.mountPath "pgdata" | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.global.pgDbName }}
            - name: POSTGRES_USER
              value: {{ .Values.global.pgDbUser }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "helper.names.fullname" . }}
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: >-
                -c include_if_exists={{ printf "%s/%s" .Values.postgresql.persistence.mountPath "conf/postgresql.conf" | quote }}
                -c hba_file={{ printf "%s/%s" .Values.postgresql.persistence.mountPath "conf/pg_hba.conf" | quote }}
          {{- if not .Values.postgresql.diagnosticModeEnabled }}
          startupProbe: {{- include "helper.values.render" ( dict "value" .Values.postgresql.startupProbe "context" $ ) | nindent 12 }}
            exec:
              command:
                - pg_isready
          readinessProbe: {{- include "helper.values.render" ( dict "value" .Values.postgresql.readinessProbe "context" $ ) | nindent 12 }}
            exec:
              command:
                - pg_isready
          livenessProbe: {{- include "helper.values.render" ( dict "value" .Values.postgresql.livenessProbe "context" $ ) | nindent 12 }}
            exec:
              command:
                - pg_isready
          {{- end }}
          {{- if .Values.postgresql.resources }}
          resources: {{- include "helper.values.render" (dict "value" .Values.postgresql.resources "context" $) | nindent 12 }}
          {{- else }}
          resources: {{- include "helper.resources.preset" (dict "type" .Values.postgresql.resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.postgresql.persistence.mountPath }}
              subPath:  {{ .Values.postgresql.persistence.subPath | default "" }}
            - name: config
              mountPath: {{ .Values.postgresql.persistence.mountPath }}/conf/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
            - name: config
              mountPath: {{ printf "%s/%s" .Values.postgresql.persistence.mountPath "conf/postgresql.conf" | quote }}
              subPath: postgresql.conf
              readOnly: true
            - name: dev-shm
              mountPath: /dev/shm
            - name: empty-dir
              mountPath: /var/run/postgresql
              subPath: run/postgresql
      volumes:
        - name: empty-dir
          emptyDir: {}
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.postgresql.devShmSize }}
        - name: config
          configMap:
            name: {{ include "helper.names.fullname" . }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          {{- include "helper.labels.labels" . | nindent 10 }}
          app.kubernetes.io/component: postgresql
          role: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
        {{- include "helper.names.storageClass" (dict "persistence" .Values.postgresql.persistence "global" .Values.global) | nindent 10 }}
    
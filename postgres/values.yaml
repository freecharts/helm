## @param nameOverride This is to override the chart name.
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

## @param global Global values that can be accessed from any subchart
global:
  ## @param global.imageRegistry Global Docker image registry
  imageRegistry: ""
  ## @param global.imagePullSecrets Global Docker registry secret names as an array
  imagePullSecrets: []
  ## @param global.pullPolicy Global Docker image pull policy
  pullPolicy: ""
  ## @param global.timezone Timezone for PostgreSQL container, more information can be found here: https://www.postgresql.org/docs/current/datetime-config.html#GUC-TIMEZONE
  timezone: "Europe/Zurich"
  ## @param global.storageClass Global default StorageClass for Persistent Volume(s)
  storageClass: ""
  defaultStorageClass: ""
  ## Postgres authentication parameters, more information can be found here: https://www.postgresql.org/docs/current/auth-pg-hba-conf.html
  pgDbName: "postgres"
  pgDbUser: "postgres"
  ## @param global.pgDbPassword This sets the PostgreSQL password, more information can be found here: https://www.postgresql.org/docs/current/app-psql.html
  ## Leave blank to generate a random password, or set a value to use a specific
  pgDbPassword: ""
  ## @param global.pgCheckUser This sets the check user, more information can be found here: https://repmgr.org/docs/current/pgpool.html
  pgCheckUser: "pg_checkusr"
  ## @param global.pgCheckPassword This sets the check user password
  ## Leave blank to generate a random password, or set a value to use a specific password
  pgCheckPassword: ""
  ## @param global.pgRepUser This sets the repliaction user, more information can be found here: https://repmgr.org/docs/current/pgpool.html
  ## Useless if pgpool is disabled, but must be set if pgpool is enabled
  pgRepUser: "pg_repusr"
  ## @param global.pgRepPassword This sets the replication user password
  ## Leave blank to generate a random password, or set a value to use a specific password
  pgRepPassword: ""
  ## @param pgpool.pgPoolUser This sets the pgpool user, more information can be found here: https://www.pgpool.net/docs/latest/en/html/configuring-pcp-conf.html
  pgPoolUser: "pgpool"
  ## @param pgpool.pgPoolPassword This sets the pgpool password, more information can be found here: https://www.pgpool.net/docs/latest/en/html/configuring-pcp-conf.html
  ## Leave blank to generate a random password, or set a value to use a specific password.
  pgPoolPassword: ""

## @param diagnosticMode Diagnostic mode in the deployment
##
diagnosticMode:
  ## @param diagnosticMode.command [array] Command to override all containers in the deployment
  ##
  command:
    - sleep
  ## @param diagnosticMode.args [array] Args to override all containers in the deployment
  ##
  args:
    - infinity

## Default values for postgres.
postgresql:
  ## @param postgresql.diagnosticModeEnabled This set diagnostic mode for PostgreSQL deployment, more information can be found here: https://kubernetes.io/docs/tasks/debug-application-cluster/debug-running-pod/#ephemeral-debug-containers
  diagnosticModeEnabled: false
  ## @param postgresql.imagePullSecrets this set image pull secrets for both init and main container, more information can be found here: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
  imagePullSecrets: []
  ## @param postgresql.initImage This sets the container init image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  initImage:
    registry: "ghcr.io/freecharts"
    repository: "fcutils"
    tag: "1.0.0"
    digest: ""
    pullPolicy: ""
  ## @param postgresql.image This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    registry: ""
    repository: "postgres"
    tag: ""
    digest: ""
    ## default pull policy is 'IfNotPresent' if the tag is not 'latest', otherwise 'Always'
    pullPolicy: ""
  ## @param postgresql.replicaCount This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicas: 1
  ## @param postgresql.containerPort This sets the container port, more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  containerPort: 5432
  ## @param postgresql.headlessWithNotReadyAddresses set postgres headless service into publishNotReadyAddresses mode
  ## It can be used to minimize/eliminate Pgpool-II restarts during PostgreSQL rolling upgrades or edge-case situations like
  ## network split. It expects that no other external component will use PostgreSQL headless service to connect or that
  ## such component implements re-try logic.
  ## This mode also enables enriched readiness probe implementation which delays first switch of POD to READY state
  ## after start/restart of container. It gives Pgpool-II time switch node back from DOWN to UP state during rolling
  ## upgrade.
  ##
  headlessWithNotReadyAddresses: true
  ## Persistence configuration for PostgreSQL data. More information can be found here: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  persistence:
    ## @param postgresql.persistence.storageClass Storage class for persistence
    storageClass: ""
    ## @param postgresql.persistence.mountPath The path the volume will be mounted at, useful when using different PostgreSQL images.
    ##
    mountPath: /opt/postgresql
    ## @param postgresql.persistence.subPath SubPath for the data volume, useful when using different PostgreSQL images.
    subPath: ""
    ## @param postgresql.persistence.size Size for persistence
    size: 8Gi
  ## @param postgresql.updateStrategy.type Postgresql StatefulSet strategy type
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies
  ## e.g:
  ## updateStrategy:
  ##  type: RollingUpdate
  ##  rollingUpdate:
  ##    maxSurge: 25%
  ##    maxUnavailable: 25%
  ##
  updateStrategy:
    type: RollingUpdate
  ## @param postgresql.podManagementPolicy Sets the pod management policy
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#pod-management-policies
  ##
  podManagementPolicy: Parallel
  ## You can use this parameter to specify the content for postgresql.conf
  ## Example:
  ## configuration: |-
  ##   listen_addresses = '*'
  ##   port = '5432'
  ##   ...
  ##
  configuration: ""
  ## You can use this parameter to specify the content for pg_hba.conf
  ## Otherwise, a pg_hba.conf will be generated automaticly
  ## Example:
  ## pgHbaConfiguration: |-
  ##   host     all            repmgr    0.0.0.0/0    md5
  ##   host     repmgr         repmgr    0.0.0.0/0    md
  ##   ...
  ##
  pgHbaConfiguration: ""
  ## @param postgresql.podAffinity Pod affinity for PostgreSQL pods assignment
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
  ## e.g:
  ##         labelSelector:
  ##           matchLabels:
  ##             app.kubernetes.io/name: essais
  ##             app.kubernetes.io/instance: dbtest
  ##             app.kubernetes.io/component: demo
  ##             role: data
  ##         topologyKey: "kubernetes.io/hostname"
  ##
  podAffinity: {}
  podAffinityWeight: 1
  ## @param postgresql.nodeSelector Node labels for PostgreSQL pods assignment
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
  ##
  nodeSelector: {}
  ## @param postgresql.tolerations Tolerations for PostgreSQL pods assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  ##
  tolerations: []
  ## @param postgresql.priorityClassName Pod priority class
  ## Ref: https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/
  ##
  priorityClassName: ""
  ## @param postgresql.terminationGracePeriodSeconds Seconds PostgreSQL pod needs to terminate gracefully
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
  ##
  terminationGracePeriodSeconds: ""
  ## @param postgresql.devShmSize Size of /dev/shm for PostgreSQL container, more information can be found here: https://www.postgresql.org/docs/current/kernel-resources.html#KRNLMEM-SHMEM
  devShmSize: 256Mi
  ## @param postgresql.resourcesPreset Preset for PostgreSQL resource requests and limits, more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/#resource-presets
  ## e.g:
  ## resourcesPreset: medium
  resourcesPreset: nano
  ## @param postgresql.resources Resource requests and limits for PostgreSQL container, more information can be found here: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  ## e.g:
  ## resources:
  ##   limits:
  ##     cpu: 100m
  ##     memory: 128Mi
  ##   requests:
  ##     cpu: 100m
  ##     memory: 128Mi
  ## 
  resources: {}
  ## @param postgresql.podSecurityContext Security context for PostgreSQL pods, 
  ## more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    fsGroupChangePolicy: OnRootMismatch
    fsGroup: 999
  ## Container Security Context
  ## https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  ## e.g:
  ##   containerSecurityContext:
  ##     capabilities:
  ##       drop: ["NET_RAW"]
  ##     readOnlyRootFilesystem: true
  ##
  containerSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"
  ## PostgreSQL container's startup probe
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-probes
  startupProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 10
  ## PostgreSQL container's readiness probe
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-probes
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6
  ## PostgreSQL container's liveness probe
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-probes
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6

## @param pgpool Default values for pgpool.
pgpool:
  ## @param pgpool.enable Enable pgpool
  enable: false
  ## @param pgpool.diagnosticModeEnabled This set diagnostic mode for PostgreSQL deployment, more information can be found here: https://kubernetes.io/docs/tasks/debug-application-cluster/debug-running-pod/#ephemeral-debug-containers
  diagnosticModeEnabled: false
  ## @param pgpool.imagePullSecrets this set image pull secrets for both init and main container, more information can be found here: https://kubernetes.io/docs/concepts/containers/images/#specifying-imagepullsecrets-on-a-pod
  imagePullSecrets: []
  ## @param pgpool.initImage This sets the container init image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  initImage:
    registry: "ghcr.io/freecharts"
    repository: "fcutils"
    tag: "1.0.0"
    digest: ""
    pullPolicy: ""
  ## This sets the container image, more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    registry: "ghcr.io/freecharts"
    repository: "pgpool"
    tag: "4.6.1-2.4"
    digest: ""
    pullPolicy: ""
  ## @param pgpool.maxBackendNodes This will set the maximum replicaset exoected count in pg cluster.
  maxBackendNodes: 10
  ## @param pgpool.containerPort This sets the container port, more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  containerPort: 5432
  ## @param pgpool.podSecurityContext Security context for PostgreSQL pods, 
  ## more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext:
    fsGroupChangePolicy: OnRootMismatch
    fsGroup: 999
  ## Container Security Context
  ## https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  ## e.g:
  ##   containerSecurityContext:
  ##     capabilities:
  ##       drop: ["NET_RAW"]
  ##     readOnlyRootFilesystem: true
  ##
  containerSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"

## This is for setting up a service, more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  portName: "tcp-postgres"
  ## @param service.port This sets the ports, more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 5432

serviceAccount:
  ## @param serviceAccount.create Specifies whether a ServiceAccount should be created
  create: true
  ## @param serviceAccount.name The name of the ServiceAccount to use.
  name: ""